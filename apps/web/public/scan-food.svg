<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Scan food">
  <g stroke="#111" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- phone body -->
    <rect x="72" y="20" width="272" height="472" rx="40" fill="#3E8CC7"/>
    <!-- top / bottom bezels -->
    <path d="M72 84 h272 M72 428 h272" fill="none"/>
    <rect x="168" y="46" width="80" height="14" rx="7" fill="#D3D9DD" stroke="none"/>
    <circle cx="208" cy="460" r="10" fill="#D3D9DD" stroke="none"/>
    <!-- search box on screen -->
    <rect x="104" y="112" width="196" height="72" rx="12" fill="#D3D9DD"/>
    <g fill="#111" stroke="none">
      <circle cx="138" cy="150" r="8"/>
      <circle cx="168" cy="150" r="8"/>
      <circle cx="198" cy="150" r="8"/>
    </g>
    <!-- list rows -->
    <g stroke="#111" stroke-width="18" stroke-linecap="round">
      <path d="M104 224 h64"/>
      <path d="M104 262 h104"/>
      <path d="M104 300 h84"/>
      <path d="M104 338 h120"/>
      <path d="M104 376 h72"/>
    </g>
    <!-- magnifying glass -->
    <line x1="398" y1="356" x2="470" y2="428" stroke="#C0453C" stroke-width="34"/>
    <circle cx="330" cy="288" r="96" fill="#E15B54"/>
    <circle cx="330" cy="288" r="58" fill="#83C6D4"/>
    <path d="M300 258 a42 42 0 0 1 30 -12" fill="none" stroke="#fff" stroke-width="14"/>
  </g>
</svg>
